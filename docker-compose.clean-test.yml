# Isolated clean-host verification overlay.
# Use with: docker compose -p kepryx-clean -f docker-compose.yml -f docker-compose.clean-test.yml ...
# This is a test harness, not a production topology.

networks:
  kepryx-internal:
    name: kepryx-clean-internal
  kepryx-edge:
    name: kepryx-clean-edge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
  kepryx-egress:
    name: kepryx-clean-egress
  kepryx-virtual-scan:
    name: kepryx-clean-virtual-scan
    internal: true
    ipam:
      config:
        - subnet: 198.51.100.0/28
          ip_range: 198.51.100.8/29

services:
  caddy:
    ports: !override
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8081:80"
    volumes:
      - ./docker/Caddyfile.clean-test:/etc/caddy/Caddyfile:ro
    networks:
      kepryx-edge:
        ipv4_address: 172.30.0.2

  api:
    environment:
      ALLOWED_HOSTS: "kepryx.local,localhost,127.0.0.1"
      CORS_ORIGINS: '["https://kepryx.local:8444"]'
      MANAGEMENT_CIDRS: '["127.0.0.1/32","::1/128","172.30.0.0/24"]'
      SCAN_NETWORKS: '["198.51.100.0/28"]'

  worker-scanner:
    environment:
      SCAN_NETWORKS: '["198.51.100.0/28"]'
    networks: !override
      - kepryx-internal
      - kepryx-egress
      - kepryx-virtual-scan

  virtual-target:
    image: kepryx-caddy:latest
    command: ["file-server", "--root", "/srv/frontend", "--listen", ":8080"]
    networks:
      kepryx-virtual-scan:
        ipv4_address: 198.51.100.10
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]

  caddy-dev:
    profiles: ["clean-test-disabled"]
