name: Weekly container rescan

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Rebuild release images with current upstream layers
        run: >-
          docker compose --profile demo build --pull --no-cache
          api worker-recon worker-enrich worker-selfsec worker-scanner beat
          caddy postgres asset-source-mock

      - name: Scan every release image without hiding unfixed findings
        shell: bash
        run: |
          set -euo pipefail
          images=(
            kepryx-api:0.9.0
            kepryx-worker-recon
            kepryx-worker-enrich
            kepryx-worker-selfsec
            kepryx-worker-scanner
            kepryx-beat
            kepryx-caddy
            kepryx-postgres
            kepryx-asset-source-mock
          )
          for image in "${images[@]}"; do
            echo "Scanning ${image}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.67.2 image \
              --ignore-unfixed=false \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "${image}"
          done
