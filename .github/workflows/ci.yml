name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  SECRET_KEY: ssssssssssssssssssssssssssssssss # pragma: allowlist secret
  JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj # pragma: allowlist secret
  ENCRYPTION_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee # pragma: allowlist secret
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: kepryx_test
  POSTGRES_USER: kepryx
  POSTGRES_PASSWORD: test # pragma: allowlist secret
  REDIS_PASSWORD: test # pragma: allowlist secret
  REDIS_URL: redis://localhost:6379/0
  ANTHROPIC_API_KEY: ""
  ALLOWED_HOSTS: '["testserver", "localhost", "127.0.0.1"]'
  CORS_ORIGINS: '["https://localhost"]'

jobs:
  quality-security-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_DB: kepryx_test
          POSTGRES_USER: kepryx
          POSTGRES_PASSWORD: test # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kepryx -d kepryx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install hash-locked toolchain
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app/ alembic/ scripts/ tests/ demo/

      - name: Ruff formatting
        run: ruff format --check app/ alembic/ scripts/ tests/ demo/

      - name: Mypy
        run: mypy app/

      - name: Test suite
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50

      - name: Import and bytecode checks
        run: |
          python -m compileall -q app demo
          python -c "import app.main; print('app-import-ok')"

      - name: Alembic upgrade and drift check
        run: |
          alembic upgrade head
          alembic check

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Bandit SAST
        run: bandit -r app/ demo/ -ll -ii --skip B101

      - name: Python dependency CVE gate
        run: pip-audit --strict --disable-pip -r requirements.txt

      - name: Secret detection gate
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-security-migrations
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: kepryx-api:ci

      - name: Build worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: kepryx-worker:ci

      - name: Build scanner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.scanner
          push: false
          load: true
          tags: kepryx-scanner:ci

      - name: Build hardened edge image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.caddy
          push: false
          load: true
          tags: kepryx-caddy:ci

      - name: Build hardened database image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.postgres
          push: false
          load: true
          tags: kepryx-postgres:ci

      - name: Build synthetic Asset Source fixture
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.asset-source-mock
          push: false
          load: true
          tags: kepryx-asset-source-mock:ci

      - name: Verify runtime boundary
        run: |
          test "$(docker run --rm kepryx-api:ci id -u)" = "10001"
          ! docker run --rm kepryx-api:ci sh -c "command -v pip"
          test "$(docker run --rm --entrypoint id kepryx-caddy:ci -u)" = "10001"
          ! docker run --rm --entrypoint sh kepryx-postgres:ci -c "command -v gosu"
          test "$(docker run --rm --entrypoint id kepryx-asset-source-mock:ci -u)" = "10001"
          docker run --rm -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            kepryx-caddy:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom
          declare -A images=(
            [api]=kepryx-api:ci
            [worker]=kepryx-worker:ci
            [scanner]=kepryx-scanner:ci
            [caddy]=kepryx-caddy:ci
            [postgres]=kepryx-postgres:ci
            [asset-source-mock]=kepryx-asset-source-mock:ci
          )
          for name in "${!images[@]}"; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/workspace" \
              aquasec/trivy:0.67.2 image \
              --quiet \
              --skip-version-check \
              --format cyclonedx \
              --output "/workspace/artifacts/sbom/${name}.cdx.json" \
              "${images[$name]}"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kepryx-cyclonedx-sboms
          path: artifacts/sbom/
          if-no-files-found: error

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kepryx-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          scanners: vuln

      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kepryx-worker:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          scanners: vuln

      - name: Scan scanner image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kepryx-scanner:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          scanners: vuln

      - name: Scan edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kepryx-caddy:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          scanners: vuln

      - name: Scan database image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kepryx-postgres:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          scanners: vuln

      - name: Scan synthetic Asset Source fixture
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kepryx-asset-source-mock:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          scanners: vuln
