<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Kepryx v0.9 release scorecard chart</title>
  <desc id="desc">Weighted current score versus v0.9 target: security 24 of 25 versus 23, product value 22 of 25 versus 21, reliability 18 of 20 versus 15, documentation 13 of 15 versus 13, community 5 of 15 versus 10, total 82 of 100.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#121d34"/></linearGradient>
    <style>
      .title{font:500 26px Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:400 13px Segoe UI,Arial,sans-serif;fill:#a8b7cc}.label{font:400 14px Segoe UI,Arial,sans-serif;fill:#cbd5e1}.value{font:500 13px Consolas,monospace;fill:#f8fafc}.current{fill:#3b82f6}.target{stroke:#f5b84b;stroke-width:3}.track{fill:#17243b}.axis{stroke:#415676;stroke-width:1}.tick{font:400 11px Segoe UI,Arial,sans-serif;fill:#94a3b8}.note{font:400 12px Segoe UI,Arial,sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <text x="54" y="46" class="title">Release confidence · weighted scorecard</text>
  <text x="54" y="72" class="sub">Current evidence snapshot compared with the v0.9 launch target; this is a decision aid, not a certification.</text>
  <line x1="330" y1="115" x2="330" y2="470" class="axis"/><line x1="330" y1="470" x2="1060" y2="470" class="axis"/>
  <text x="330" y="498" class="tick">0</text><text x="505" y="498" class="tick">5</text><text x="680" y="498" class="tick">10</text><text x="855" y="498" class="tick">15</text><text x="1030" y="498" class="tick">20</text>
  <text x="330" y="520" class="tick">weighted points within each area</text>
  <text x="55" y="133" class="label">Security and supply chain</text><rect x="330" y="118" width="730" height="28" rx="4" class="track"/><rect x="330" y="118" width="701" height="28" rx="4" class="current"/><line x1="1002" y1="112" x2="1002" y2="152" class="target"/><text x="1080" y="138" class="value">24 / 25 · target 23</text>
  <text x="55" y="201" class="label">Demonstrable product value</text><rect x="330" y="186" width="730" height="28" rx="4" class="track"/><rect x="330" y="186" width="642" height="28" rx="4" class="current"/><line x1="964" y1="180" x2="964" y2="220" class="target"/><text x="1080" y="206" class="value">22 / 25 · target 21</text>
  <text x="55" y="269" class="label">Reliability and testing</text><rect x="330" y="254" width="730" height="28" rx="4" class="track"/><rect x="330" y="254" width="657" height="28" rx="4" class="current"/><line x1="878" y1="248" x2="878" y2="288" class="target"/><text x="1080" y="274" class="value">18 / 20 · target 15</text>
  <text x="55" y="337" class="label">Documentation and onboarding</text><rect x="330" y="322" width="730" height="28" rx="4" class="track"/><rect x="330" y="322" width="633" height="28" rx="4" class="current"/><line x1="963" y1="316" x2="963" y2="356" class="target"/><text x="1080" y="342" class="value">13 / 15 · target 13</text>
  <text x="55" y="405" class="label">Community and governance</text><rect x="330" y="390" width="730" height="28" rx="4" class="track"/><rect x="330" y="390" width="243" height="28" rx="4" class="current"/><line x1="817" y1="384" x2="817" y2="424" class="target"/><text x="1080" y="410" class="value">5 / 15 · target 10</text>
  <rect x="55" y="525" width="18" height="12" rx="2" class="current"/><text x="82" y="536" class="note">current</text><line x1="158" y1="519" x2="158" y2="541" class="target"/><text x="170" y="536" class="note">target</text><text x="360" y="536" class="note">Total: 82 / 100 · strongest gap is community/governance, not core product evidence.</text>
</svg>
