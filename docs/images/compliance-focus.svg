<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Annotated Kepryx compliance screenshot</title>
  <desc id="desc">The compliance screenshot with focus boxes around framework posture summaries and the control evidence table.</desc>
  <defs>
    <style>
      .bg{fill:#08111f}.panel{fill:#111c31;stroke:#334766;stroke-width:1.5}.title{font:500 24px Segoe UI,Arial,sans-serif;fill:#f8fafc}.head{font:500 16px Segoe UI,Arial,sans-serif;fill:#f8fafc}.body{font:400 13px Segoe UI,Arial,sans-serif;fill:#cbd5e1}.small{font:400 12px Segoe UI,Arial,sans-serif;fill:#94a3b8}.focus{fill:none;stroke:#f5b84b;stroke-width:4;stroke-dasharray:12 8}.num{font:500 13px Consolas,monospace;fill:#f5b84b}.line{fill:none;stroke:#f5b84b;stroke-width:2}
    </style>
  </defs>
  <rect width="1500" height="720" class="bg"/>
  <text x="40" y="42" class="title">Compliance evidence · focus areas for the recording</text>
  <text x="40" y="68" class="small">Use the summary to orient the reviewer; use lineage and observed evidence to justify the result.</text>
  <rect x="40" y="90" width="800" height="560" rx="10" class="panel"/>
  <image href="compliance-evidence.png" x="50" y="100" width="780" height="439" preserveAspectRatio="none"/>
  <rect x="185" y="142" width="645" height="125" rx="4" class="focus"/>
  <rect x="185" y="288" width="645" height="245" rx="4" class="focus"/>
  <text x="885" y="160" class="num">01 · FRAMEWORK POSTURE</text><text x="885" y="185" class="body">Percentages summarize the latest graduated results by framework.</text><text x="885" y="208" class="small">Do not present them as certification.</text>
  <path d="M860 175 L830 175" class="line"/>
  <text x="885" y="355" class="num">02 · CONTROL EVIDENCE</text><text x="885" y="380" class="body">Show one control, its status, observed JSON, timestamp, and lineage.</text><text x="885" y="403" class="small">This is the chain a reviewer can inspect.</text>
  <path d="M860 370 L830 370" class="line"/>
  <text x="885" y="520" class="num">03 · REPORT MESSAGE</text><text x="885" y="545" class="body">The report is useful because it preserves traceability.</text><text x="885" y="568" class="small">Organization procedures and exceptions remain necessary.</text>
  <text x="885" y="625" class="small">Reference: docs/diagrams/compliance-evidence-lineage.svg</text>
</svg>
